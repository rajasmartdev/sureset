<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeyondA1C - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Medical-themed animated background */
        .medical-bg {
            position: absolute;
            /* width: 100%; */
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.03;
        }

        .pulse {
            position: absolute;
            width: 400px;
            height: 400px;
            border: 2px solid #001f7d;
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        .pulse:nth-child(1) {
            top: 10%;
            left: -10%;
            animation-delay: 0s;
        }

        .pulse:nth-child(2) {
            bottom: 10%;
            right: -10%;
            animation-delay: 2s;
        }

        .pulse:nth-child(3) {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 1s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.5;
            }
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo-section {
            margin-bottom: 80px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-section svg {
            max-width: 600px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 5px 20px rgba(0, 31, 125, 0.15));
        }

        .main-content {
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .coming-soon-badge {
            display: inline-block;
            background: linear-gradient(135deg, #001f7d 0%, #4169e1 100%);
            color: white;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 31, 125, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 3.5em;
            color: #001f7d;
            font-weight: 800;
            margin-bottom: 30px;
            line-height: 1.2;
        }

        .highlight {
            color: #4169e1;
            position: relative;
            display: inline-block;
        }

        .subtitle {
            font-size: 1.5em;
            color: #555;
            font-weight: 400;
            margin-bottom: 50px;
            line-height: 1.6;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin: 60px auto;
            max-width: 900px;
            animation: fadeIn 1.2s ease-out 0.6s both;
        }

        .feature-card {
            background: #ffffff;
            border: 2px solid #f0f0f0;
            border-radius: 20px;
            padding: 40px 30px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #001f7d, #4169e1);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 31, 125, 0.15);
            border-color: #4169e1;
        }

        .feature-card:hover::before {
            transform: scaleX(1);
        }

        .feature-icon {
            font-size: 3.5em;
            margin-bottom: 20px;
            display: block;
        }

        .feature-title {
            font-size: 1.3em;
            color: #001f7d;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .feature-desc {
            color: #666;
            line-height: 1.6;
            font-size: 1em;
        }

        .cta-section {
            margin-top: 70px;
            animation: fadeIn 1.4s ease-out 0.9s both;
        }

        .contact-text {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 20px;
        }

        .contact-link {
            display: inline-block;
            color: #4169e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2em;
            padding: 15px 40px;
            border: 2px solid #4169e1;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .contact-link:hover {
            background: #4169e1;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(65, 105, 225, 0.3);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .subtitle {
                font-size: 1.2em;
            }

            .features-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .feature-card {
                padding: 30px 20px;
            }

            .coming-soon-badge {
                font-size: 0.8em;
                padding: 10px 30px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1em;
            }
        }
    </style>
</head>
